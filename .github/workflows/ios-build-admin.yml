name: iOS build (admin)

on:
  push:
    branches: [main]
    paths: ['FundiMtaaniAdmin/**', '.github/workflows/ios-build-admin.yml']
  pull_request:
    paths: ['FundiMtaaniAdmin/**', '.github/workflows/ios-build-admin.yml']
  workflow_dispatch:

jobs:
  build:
    name: Build FundiMtaaniAdmin (unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets
        working-directory: FundiMtaaniAdmin
        run: xcodebuild -list -project FundiMtaaniAdmin.xcodeproj

      - name: Build for simulator
        working-directory: FundiMtaaniAdmin
        run: |
          xcodebuild build \
            -project FundiMtaaniAdmin.xcodeproj \
            -target FundiMtaaniAdmin \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        working-directory: FundiMtaaniAdmin
        run: |
          # No shared scheme is committed, and `xcodebuild archive`
          # requires -scheme with -archivePath, so build for a generic
          # iOS device instead and package the unsigned .app directly.
          xcodebuild build \
            -project FundiMtaaniAdmin.xcodeproj \
            -target FundiMtaaniAdmin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH" || { echo "No .app found in the build products"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r FundiMtaaniAdmin-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FundiMtaaniAdmin-unsigned-ipa
          path: FundiMtaaniAdmin/build/FundiMtaaniAdmin-unsigned.ipa
          retention-days: 30
