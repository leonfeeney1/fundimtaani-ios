name: iOS build (native customer)

on:
  push:
    branches: [main]
    paths: ['FundiMtaaniNative/**', '.github/workflows/ios-build-native-customer.yml']
  pull_request:
    paths: ['FundiMtaaniNative/**', '.github/workflows/ios-build-native-customer.yml']
  workflow_dispatch:

jobs:
  build:
    name: Build FundiMtaaniNative (unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets
        working-directory: FundiMtaaniNative
        run: xcodebuild -list -project FundiMtaaniNative.xcodeproj

      - name: Build for simulator
        working-directory: FundiMtaaniNative
        run: |
          xcodebuild build \
            -project FundiMtaaniNative.xcodeproj \
            -scheme FundiMtaaniNative \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive unsigned IPA
        working-directory: FundiMtaaniNative
        run: |
          # The shared scheme lives in xcshareddata/xcschemes, so
          # -scheme works for both archive and -derivedDataPath (both
          # reject -target without one).
          xcodebuild archive \
            -project FundiMtaaniNative.xcodeproj \
            -scheme FundiMtaaniNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FundiMtaaniNative.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH=$(find build/FundiMtaaniNative.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH" || { echo "No .app found in the archive"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r FundiMtaaniNative-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FundiMtaaniNative-unsigned-ipa
          path: FundiMtaaniNative/build/FundiMtaaniNative-unsigned.ipa
          retention-days: 30
